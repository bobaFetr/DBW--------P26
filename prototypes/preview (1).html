<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paralyze</title>

  <link rel="icon" type="image/png" href="/logo.ico">
  <link href="https://fonts.cdnfonts.com/css/ft-vortex" rel="stylesheet">

  <style>
    :root {
      --bg-main: #1a1a1a;
      --bg-dark: #111;
      --bg-panel: #2a2a2a;
      --text-main: #e0e0e0;
      --accent: white;
    }

    body {
      margin: 0;
      background: var(--bg-main);
      color: var(--text-main);
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
      height: 120px;
    }

    .logo {
      position: absolute;
      left: 90px;
      height: 90px;
    }

    .header-content {
      text-align: center;
    }

    h1 {
      font-family: 'FT Vortex', sans-serif;
      font-size: 4rem;
      margin-top: 20px;
      color: var(--accent);
    }

    nav {
      text-align: center;
      margin-top: 30px;
    }

    nav button {
      background: transparent;
      border: none;
      border-bottom: 2px solid var(--accent);
      color: var(--accent);
      padding: 10px 20px;
      margin: 5px;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s;
    }

    nav button:hover,
    nav button.active {
      background: var(--accent);
      color: black;
      transform: scale(1.1);
    }

    .hero {
      height: 100vh;
      background: url('/2025-12-07.png') center/cover no-repeat;
      background-color: var(--bg-dark);
    }

    .Website_Beta_Warning {
      text-align: center;
      padding: 10px 0;
      font-weight: bold;
    }

    .Build_Number {
      text-align: center;
      padding: 5px 0;
      font-size: 20px;
      color: gray;
    }

    .concert-photo {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 60px auto;
    }

    .concert-photo img {
      border: 3px solid var(--accent);
      border-radius: 10px;
      box-shadow: 0 0 15px var(--accent);
    }

    .Photo_Title {
      margin-top: 10px;
      font-family: 'FT Vortex', sans-serif;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .music-ad {
      margin-top: 20px;
      padding: 20px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.1));
      border: 2px solid var(--accent);
      border-radius: 8px;
      text-align: center;
    }

    .music-ad p {
      margin: 5px 0;
      font-size: 1.1rem;
    }

    .music-ad p strong {
      color: var(--accent);
      font-family: 'FT Vortex', sans-serif;
    }

    .ad-buttons {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .ad-buttons a {
      text-decoration: none;
    }

    .music-btn {
      background: var(--accent);
      color: black;
      border: none;
      padding: 10px 15px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      border-radius: 5px;
      transition: 0.3s;
    }

    .music-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 10px var(--accent);
    }

    .about {
      width: 70%;
      margin: 60px auto;
      padding: 30px;
      background: var(--bg-panel);
      border: 2px solid var(--accent);
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 20px var(--accent);
    }

    .about h2 {
      font-family: 'FT Vortex', sans-serif;
      color: var(--accent);
      font-size: 3rem;
    }

    .members p {
      font-family: 'FT Vortex', sans-serif;
      color: var(--accent);
      letter-spacing: 1px;
    }

    .gallery {
      width: 90%;
      max-width: 1200px;
      margin: 80px auto;
      padding: 40px 20px;
    }

    .gallery h2 {
      font-family: 'FT Vortex', sans-serif;
      font-size: 3rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 50px;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }

    .gallery-item {
      position: relative;
      overflow: hidden;
      border-radius: 10px;
      border: 3px solid var(--accent);
      aspect-ratio: 1;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
    }

    .gallery-item:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--accent);
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.1);
    }

    .gallery-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .gallery-item:hover .gallery-overlay {
      opacity: 1;
    }

    .gallery-overlay p {
      color: var(--accent);
      font-family: 'FT Vortex', sans-serif;
      font-size: 1.1rem;
      text-align: center;
      padding: 20px;
    }

    @media (max-width: 768px) {
      .gallery-grid {
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 15px;
      }

      .gallery h2 {
        font-size: 2rem;
      }
    }

    footer {
      background-color: #2a2a2a;
      border-top: 2px solid var(--accent);
      padding: 25px 0;
      text-align: center;
      color: var(--accent);
      margin-top: 80px;
      box-shadow: 0 0 20px var(--accent);
    }

    /* Mobile menu */
    #menu-btn {
      display: none;
    }

    #mobile-menu {
      position: fixed;
      top: 0;
      left: -260px;
      width: 260px;
      height: 100%;
      background: var(--bg-dark);
      padding-top: 80px;
      transition: left 0.3s ease;
      display: flex;
      flex-direction: column;
      gap: 10px;
      z-index: 1001;
      padding-left: 20px;
    }

    #mobile-menu a {
      color: var(--accent);
      text-decoration: none;
      font-size: 1.2rem;
      padding: 10px 0;
    }

    #mobile-menu.active {
      left: 0;
    }

    body.menu-open {
      overflow: hidden;
    }

    @media (max-width: 768px) {
      #menu-btn {
        display: block;
        position: fixed;
        top: 15px;
        left: 15px;
        font-size: 28px;
        background: none;
        border: none;
        color: var(--accent);
        cursor: pointer;
        z-index: 1002;
      }

      header nav.desktop-menu,
      .header-content {
        display: none;
      }
    }

    .video-gallery-item gallery-item {
      width: 100%;
      height: 100%;
    }

    @media (min-width: 769px) {
      #mobile-menu {
        display: none !important;
        left: -320px !important;
        pointer-events: none !important;
      }

      #menu-btn {
        display: none !important;
      }

      body.menu-open {
        overflow: auto;
      }
    }
  </style>
</head>

<body>

<header>
  <img src="/logo.ico" class="logo" alt="Logo">
  <button id="menu-btn">☰</button>

  <nav id="mobile-menu">
    <a href="mainPage.html">Home</a>
    <a href="About.html">About</a>
    <a href="Concerts.html">Concerts</a>
    <a href="Merch.html">Merch</a>
    <a href="Music.html">Music</a>
    <a href="News.html">News</a>
    <a href="Timeline.html">Timeline</a>
    <a href="members.html">Members</a>
  </nav>

  <div class="header-content">
    <h1>PARALYZE</h1>
    <nav class="desktop-menu">
      <a href="NewMain.html"><button>Home</button></a>
      <a href="About.html"><button>About</button></a>
      <a href="Concerts.html"><button>Concerts</button></a>
      <a href="Albums.html"><button>Albums</button></a>
      <a href="Singles.html"><button>Singles</button></a>
      <a href="Merch.html"><button>Merch</button></a>
      <a href="News.html"><button>News</button></a>
      <a href="Timeline.html"><button>TimeLine</button></a>
      <a href="members.html"><button>Members</button></a>
      <a href="Gallery.html"><button>Gallery</button></a>
    </nav>
  </div>
</header>

<div class="Website_Beta_Warning">
  <p>WARNING THIS SITE IS CURRENTLY IN BETA VERSION!</p>
</div>

<div class="Build_Number">
  <p>Build 2.01.26</p>
</div>

<footer>
  <h5>© 2026 Paralyze</h5>
  <h4>All Rights Reserved</h4>

  <div>
    <a href="https://mail.google.com/mail/?view=cm&fs=1&to=bobata1236@gmail.com">
      Support guy!
    </a>
  </div>

  <div>
    <a href="https://www.youtube.com/@deathbywish" target="_blank">
      <img src="/youtube_icon.png" alt="YouTube" width="30" height="30">
    </a>
  </div>
</footer>

<script>
  const menuBtn = document.getElementById('menu-btn');
  const mobileMenu = document.getElementById('mobile-menu');

  const mobileQuery = window.matchMedia('(max-width: 768px)');

  function closeMobileMenuOnDesktop() {
    if (!mobileQuery.matches) {
      mobileMenu.classList.remove('active');
      document.body.classList.remove('menu-open');
    }
  }

  menuBtn.addEventListener('click', () => {
    if (!mobileQuery.matches) return;
    mobileMenu.classList.toggle('active');
    document.body.classList.toggle('menu-open');
  });

  window.addEventListener('resize', closeMobileMenuOnDesktop);
  document.addEventListener('DOMContentLoaded', closeMobileMenuOnDesktop);
</script>

</body>
</html>
