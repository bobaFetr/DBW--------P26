  <script>
    // Mark current page link/button as active (safe: only touches button if present)
    const currentPage = window.location.pathname.split('/').pop().toLowerCase() || 'mainpage.html';
    const navLinks = document.querySelectorAll('nav a');
    navLinks.forEach(link => {
      const href = link.getAttribute('href');
      if (!href) return;
      const hrefLower = href.toLowerCase();
      if (currentPage === hrefLower ||
          (currentPage === '' && hrefLower === 'mainpage.html') ||
          (currentPage === 'index.html' && hrefLower === 'mainpage.html')) {
        const btn = link.querySelector('button');
        if (btn) btn.classList.add('active');
        else link.classList.add('active');
      }
    });

    // Mobile menu toggle and behavior
    const menuBtn = document.getElementById('menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');

    if (menuBtn && mobileMenu) {
      function closeMenu() {
        mobileMenu.classList.remove('active');
        menuBtn.setAttribute('aria-expanded', 'false');
        mobileMenu.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('menu-open');
      }

      function openMenu() {
        mobileMenu.classList.add('active');
        menuBtn.setAttribute('aria-expanded', 'true');
        mobileMenu.setAttribute('aria-hidden', 'false');
        document.body.classList.add('menu-open');
      }

      menuBtn.addEventListener('click', () => {
        if (mobileMenu.classList.contains('active')) closeMenu();
        else openMenu();
      });

      // Close when clicking a link
      mobileMenu.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMenu));

      // Close when clicking outside
      document.addEventListener('click', (e) => {
        if (mobileMenu.classList.contains('active') && !mobileMenu.contains(e.target) && e.target !== menuBtn) {
          closeMenu();
        }
      });

      // Close on Escape
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && mobileMenu.classList.contains('active')) closeMenu();
      });
    }
  </script>
