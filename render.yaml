services:
  - type: web
    name: paralyze-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    envVars:
      - key: NEXT_PUBLIC_CONTENT_SOURCE
        value: temporary
      - key: ENABLE_LOCAL_ADMIN
        value: "false"
      - key: NEXT_PUBLIC_LOCAL_ADMIN_OVERLAY
        value: "false"
    headers:
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.cdnfonts.com; font-src 'self' https://fonts.cdnfonts.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: "/*"
        name: X-XSS-Protection
        value: "0"
      - path: "/*"
        name: Strict-Transport-Security
        value: "max-age=31536000"

