services:
  - type: web
    name: paralyze-site
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./out
    headers:
      - path: "/*"
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; font-src 'self' https://fonts.cdnfonts.com; img-src 'self' data: blob:; media-src 'self' data: blob:; connect-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
      - path: "/*"
        name: X-Content-Type-Options
        value: nosniff
      - path: "/*"
        name: X-Frame-Options
        value: DENY
      - path: "/*"
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: "/*"
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=()
      - path: "/*"
        name: X-XSS-Protection
        value: "0"
